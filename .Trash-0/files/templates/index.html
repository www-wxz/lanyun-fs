<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能教学交互界面</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { margin:0; font-family: Arial, sans-serif; }
        #container { display: flex; height: 100vh; }
        #left { width: 35%; border-right: 1px solid #ccc; display: flex; flex-direction: column; }
        #right { flex: 1; }
        #chat { flex: 1; overflow-y: auto; padding: 10px; background: #f7f7f7; }
        #input-box { display: flex; padding: 10px; border-top: 1px solid #ccc; }
        #input-box input { flex: 1; padding: 5px; font-size: 16px; }
        #input-box button { padding: 5px 10px; font-size: 16px; margin-left: 5px; }
        .message { margin-bottom: 10px; }
        .user { color: blue; }
        .system { color: green; white-space: pre-wrap; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="container">
        <!-- 左侧对话栏 -->
        <div id="left">
            <div id="chat"></div>
            <div id="input-box">
                <input type="text" id="user-input" placeholder="请输入查询文本...">
                <button onclick="sendQuery()">发送</button>
            </div>
        </div>

        <!-- 右侧 HTML 展示 -->
        <div id="right">
            <iframe id="html-view" src="/integrated_app"></iframe>
        </div>
    </div>

    <script>
        function addMessage(text, type) {
            const chat = document.getElementById("chat");
            const div = document.createElement("div");
            div.className = "message " + type;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendQuery() {
            const input = document.getElementById("user-input");
            const text = input.value.trim();
            if (!text) return;
            addMessage(text, "user");
            input.value = "";

            addMessage("正在处理...", "system");

            const response = await fetch("/query", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({query: text})
            });

            const data = await response.json();
            if (data.error) {
                addMessage("错误: " + data.error, "system");
            } else {
                // 显示日志
                addMessage(data.log, "system");
                // 刷新 iframe
                document.getElementById("html-view").src = data.html_path + "?t=" + new Date().getTime();
            }
        }
    </script>
</body>
</html>
